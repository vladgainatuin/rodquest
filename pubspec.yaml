name: rodquest
description: "Родквест — семейный таск-трекер в стиле MMORPG."
publish_to: 'none'
version: 0.9.0+9

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_local_notifications: '>=19.0.0 <100.0.0'
  timezone: '>=0.10.0 <100.0.0'
  file_picker: '>=10.0.0 <100.0.0'
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: PTSans
      fonts:
        - asset: assets/fonts/PTSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PTSans-Bold.ttf
          weight: 700
    - family: PTSerif
      fonts:
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
